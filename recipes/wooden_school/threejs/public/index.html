<script type="module">

const LT = () => window.__lang === "en" ? { dl: "Downloading", dec: "Unpacking", prep: "Preparing the scene" } : { dl: "ダウンロード中", dec: "展開中", prep: "シーンを準備中" };
const STEPS = { ja: ["廃墟の建物と地形", "復元した校舎と地形", "木と草の配置", "花びら", "描画の準備（シェーダー）"], en: ["The ruin: buildings and terrain", "The restored school and terrain", "Placing trees and grass", "Petals", "Getting ready to draw (shaders)"] };
async function step(i) { const L = window.__lang === "en" ? "en" : "ja"; $("load").classList.add("busy"); document.querySelector("#load .bar").classList.add("busy");
  $("lmsg").textContent = LT().prep + " " + (i + 1) + " / " + STEPS[L].length + ": " + STEPS[L][i]; await new Promise(r => setTimeout(r, 30)); }      // (never await requestAnimationFrame here: it does not fire in a background tab)

  download("ruin.glb"), download("restored.glb"), download("ruin_veg.glb"), download("restored_veg.glb")]);
$("load").classList.add("busy"); document.querySelector("#load .bar").classList.add("busy");
showProgress(LT().dec + ": ruin.glb · restored.glb · *_veg.glb");

// ---------- sun, sky, light.  The two variants have their own weather: the ruin under a thin haze, the restored school on a clear spring day.
const toSun = new THREE.Vector3(...S.sun_to).normalize();
const sky = new Sky(); sky.scale.setScalar(4000); const su = sky.material.uniforms; su.sunPosition.value.copy(toSun); su.mieDirectionalG.value = 0.82; scene.add(sky);

  restored: { sunI: 4.3, sunC: G(1.0, 0.96, 0.90), hemi: 0.50, hemiSky: G(0.74, 0.83, 0.94), hemiGnd: G(0.40, 0.34, 0.24), sky: [3.0, 1.5, 0.005], fog: [G(0.68, 0.77, 0.87), 0.0016], env: 0.50 },

const pmrem = new THREE.PMREMGenerator(renderer); const ENVTEX = {};
{ const es = new THREE.Scene(), s2 = new Sky(); s2.scale.setScalar(1000); es.add(s2); const u = s2.material.uniforms; u.sunPosition.value.copy(toSun); u.mieDirectionalG.value = 0.82;
  for (const [k, L] of Object.entries(LOOK)) { u.turbidity.value = L.sky[0]; u.rayleigh.value = L.sky[1]; u.mieCoefficient.value = L.sky[2]; ENVTEX[k] = pmrem.fromScene(es, 0.04).texture; } }

const sun = new THREE.DirectionalLight(0xffffff, 4); sun.castShadow = true; sun.shadow.mapSize.set(Q.shadow, Q.shadow);
const SH = 34; Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 1, far: 400 });

const allMats = new Set();
function applyLook(v) {

// ---------- leaf textures (drawn here): a 1024 px atlas of four sprigs per kind; the grey value multiplies the colour stored in each card
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
